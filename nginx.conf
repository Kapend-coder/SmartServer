# Configuration Nginx pour Smart Serveur Web (Android)
# Réalisé par Arsène KAPEND A KALEND (Smart Solution)

worker_processes 1;
daemon off;
pid /data/user/0/com.smartsolution.smartserveurweb/files/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile off;
    keepalive_timeout 65;
    client_max_body_size 64M;

    server {
        listen 8080;
        server_name localhost;
        root /storage/emulated/0/SmartServeurWeb/htdocs;
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Traitement PHP-FPM
        location ~ .php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Alias phpMyAdmin
        location /phpmyadmin {
            alias /data/user/0/com.smartsolution.smartserveurweb/files/phpmyadmin;
            index index.php index.html;

            location ~ .php$ {
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                include fastcgi_params;
            }
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
