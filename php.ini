; Configuration PHP 8.2 pour Smart Serveur Web
; Réalisé par Arsène KAPEND A KALEND (Smart Solution)

[PHP]
engine = On
short_open_tag = On
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On
expose_php = On
max_execution_time = 120
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED
display_errors = On
display_startup_errors = On
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 64M
default_mimetype = "text/html"
default_charset = "UTF-8"
file_uploads = On
upload_max_filesize = 64M
max_file_uploads = 20
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60

[Date]
date.timezone = "Africa/Lubumbashi"

[Pdo_mysql]
pdo_mysql.cache_size = 2000
pdo_mysql.default_socket = "/data/user/0/com.smartsolution.smartserveurweb/files/mysql.sock"

[MySQLi]
mysqli.max_persistent = -1
mysqli.allow_persistent = On
mysqli.max_links = -1
mysqli.cache_size = 2000
mysqli.default_port = 3306
mysqli.default_socket = "/data/user/0/com.smartsolution.smartserveurweb/files/mysql.sock"
mysqli.reconnect = Off
